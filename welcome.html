<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearVault - Store | Style | Repeat</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #b6d4ff 0%, #f6c4d4 100%);
            overflow: hidden;
        }

        /* Container for the centered WearVault card */
        .landing-card {
            width: 90%;
            max-width: 480px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .landing-card:hover {
            transform: scale(1.03);
        }

        .landing-card img {
            width: 100%;
            height: auto;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            display: block;
        }
    </style>
</head>
<body>

    <!-- Centered Middle Logo Card -->
    <div class="landing-card" onclick="window.location.href='usmin.html'">
        <img src="wear.jpeg" alt="WearVault - Store | Style | Repeat">
    </div>

</body>
</html>
