<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to bottom,#b6d4ff,#f6c4d4);
        }

        .login-box{
            width:380px;
            text-align:center;
        }

        .line{
            width:100%;
            height:2px;
            background:#fff;
            margin:20px 0 40px;
            opacity:0.8;
        }

        h1{
            font-size:48px;
            font-weight:300;
            color:#222;
            margin-bottom:50px;
        }

        .input-box{
            display:flex;
            align-items:center;
            border-bottom:2px solid #333;
            margin:30px 0;
            padding:10px;
        }

        .input-box i{
            margin-right:15px;
            color:#222;
            font-size:20px;
        }

        .input-box input{
            width:100%;
            border:none;
            outline:none;
            background:transparent;
            font-size:18px;
        }

        .options{
            display:flex;
            justify-content:space-between;
            margin:20px 0;
            font-size:14px;
        }

        .options a{
            text-decoration:none;
            color:#444;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            background:#062c5c;
            color:white;
            font-size:20px;
            font-weight:bold;
            cursor:pointer;
            margin-top:20px;
        }

        button:hover{
            background:#0b3c7d;
        }

        .bottom-line{
            width:100%;
            height:2px;
            background:#fff;
            margin-top:70px;
            opacity:0.8;
        }
    </style>
</head>
<body>

<div class="login-box">

    <div class="line"></div>

    <h1>User Login</h1>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="Email ID">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password">
    </div>

    <div class="options">
        <label>
            <input type="checkbox"> Remember me
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <button><a href="index.html">LOGIN</a></button>

    <div class="bottom-line"></div>

</div>

</body>
</html>
