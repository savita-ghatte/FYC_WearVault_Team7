<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to bottom,#b6d4ff,#f6c4d4);
        }

        .login-box{
            width:380px;
            padding:30px;
            text-align:center;
            background:rgba(255,255,255,0.25);
            border-radius:12px;
            backdrop-filter:blur(8px);
            box-shadow:0 8px 32px rgba(0,0,0,0.1);
        }

        .line,
        .bottom-line{
            width:100%;
            height:2px;
            background:#fff;
            opacity:.8;
        }

        .line{
            margin-bottom:25px;
        }

        .bottom-line{
            margin-top:30px;
        }

        h1{
            font-size:40px;
            font-weight:300;
            color:#222;
            margin-bottom:30px;
        }

        .input-box{
            display:flex;
            align-items:center;
            border-bottom:2px solid #333;
            margin:22px 0;
            padding:8px 5px;
            transition:.3s;
        }

        .input-box:focus-within{
            border-color:#0b3c7d;
            transform:scale(1.01);
        }

        .input-box i{
            width:22px;
            color:#222;
            font-size:18px;
        }

        .input-box input{
            width:100%;
            border:none;
            outline:none;
            background:transparent;
            font-size:16px;
            padding-left:12px;
        }

        .toggle-password{
            cursor:pointer;
            color:#555;
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin:20px 0;
            font-size:14px;
        }

        .options label{
            display:flex;
            align-items:center;
            gap:6px;
            cursor:pointer;
            color:#333;
        }

        .options a{
            text-decoration:none;
            color:#062c5c;
            font-weight:bold;
        }

        .options a:hover{
            text-decoration:underline;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:5px;
            background:#062c5c;
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#0b3c7d;
            transform:translateY(-2px);
        }

        .error-msg{
            color:#d9534f;
            font-size:13px;
            font-weight:bold;
            margin-top:15px;
            display:none;
        }

        .success-msg{
            color:#28a745;
            font-size:14px;
            font-weight:bold;
            margin-top:15px;
            display:none;
        }

        .signup{
            margin-top:20px;
            font-size:14px;
        }

        .signup a{
            color:#062c5c;
            text-decoration:none;
            font-weight:bold;
        }

        .signup a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="line"></div>

    <h1>User Login</h1>

    <form id="loginForm">

        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                id="email"
                placeholder="Email ID"
                autocomplete="email"
                required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

            <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
        </div>

        <div class="options">

            <label>
                <input type="checkbox" id="rememberMe">
                Remember me
            </label>

            <a href="fgpp.html">Forgot Password?</a>

        </div>

        <button type="submit">LOGIN</button>

        <div id="errorMsg" class="error-msg"></div>

        <div id="successMsg" class="success-msg">
            Login successful! Redirecting...
        </div>

    </form>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </div>

    <div class="bottom-line"></div>

</div>

<script>

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const rememberMe = document.getElementById("rememberMe");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");
const togglePassword = document.getElementById("togglePassword");

function validateEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function checkAndAutoFillPassword(){

    const email = emailInput.value.trim().toLowerCase();

    const remembered =
        JSON.parse(localStorage.getItem("wearvault_remembered_map")) || {};

    if(email && remembered[email]){

        passwordInput.value = remembered[email];
        rememberMe.checked = true;

    }else{

        passwordInput.value = "";
        rememberMe.checked = false;

    }

}

emailInput.addEventListener("input",checkAndAutoFillPassword);
emailInput.addEventListener("change",checkAndAutoFillPassword);

// Autofill if browser already filled email
window.addEventListener("load",checkAndAutoFillPassword);

// Show / Hide Password
togglePassword.addEventListener("click",()=>{

    if(passwordInput.type==="password"){

        passwordInput.type="text";
        togglePassword.classList.replace("fa-eye","fa-eye-slash");

    }else{

        passwordInput.type="password";
        togglePassword.classList.replace("fa-eye-slash","fa-eye");

    }

});

form.addEventListener("submit",function(e){

    e.preventDefault();

    errorMsg.style.display="none";
    successMsg.style.display="none";

    const email=emailInput.value.trim();
    const emailKey=email.toLowerCase();
    const password=passwordInput.value.trim();

    if(!validateEmail(email)){

        errorMsg.textContent="Please enter a valid email address.";
        errorMsg.style.display="block";
        return;

    }

    const users=
        JSON.parse(localStorage.getItem("wearvault_users")) || [];

    const account=
        users.find(user=>user.email.toLowerCase()===emailKey);

    if(!account){

        errorMsg.textContent="Invalid ID. Please Sign Up first!";
        errorMsg.style.display="block";
        return;

    }

    if(account.password!==password){

        errorMsg.textContent="Invalid password. Please try again.";
        errorMsg.style.display="block";
        return;

    }

    let remembered=
        JSON.parse(localStorage.getItem("wearvault_remembered_map")) || {};

    if(rememberMe.checked){

        remembered[emailKey]=password;

    }else{

        delete remembered[emailKey];

    }

    localStorage.setItem(
        "wearvault_remembered_map",
        JSON.stringify(remembered)
    );

    localStorage.setItem(
        "currentUser",
        JSON.stringify(account)
    );

    successMsg.style.display="block";

    setTimeout(()=>{
        window.location.href="index.html";
    },1000);

});

</script>

</body>
</html>
