<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #2c3e50, #000000);
        }

        .login-box {
            width: 380px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            color: #fff;
        }

        .line {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.4);
            margin: 10px 0 30px;
        }

        h1 {
            font-size: 36px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #ffffff;
            margin: 25px 0 15px 0;
            padding: 8px 5px;
        }

        .input-box i {
            margin-right: 15px;
            color: #ffffff;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            color: #ffffff;
        }

        .input-box input::placeholder {
            color: #dddddd;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 14px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #eee;
        }

        .options a {
            text-decoration: none;
            color: #4da6ff;
            font-weight: bold;
        }

        .options a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #112233;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 15px;
            transition: background 0.3s;
        }

        button:hover {
            background: #1a365d;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            line-height: 1.4;
        }

        .success-msg {
            color: #51cf66;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        .bottom-line {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.4);
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="login-box">

    <div class="line"></div>

    <h1>Admin Login</h1>

    <form id="adminLoginForm">
        <div class="input-box">
            <i class="fa-solid fa-user-shield"></i>
            <input type="email" id="adminEmail" placeholder="Admin Email ID" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="adminPassword" placeholder="Password" required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" id="rememberMe"> Remember me
            </label>

            <a href="fgpp.html">Forgot Password?</a>
        </div>

        <button type="submit">ADMIN LOGIN</button>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg">Authentication successful! Redirecting...</div>
    </form>

    <div style="margin-top: 20px; font-size: 14px; color: #ddd;">
        Don't have an admin account? <a href="adsignup.html" style="color:#4da6ff; font-weight:bold; text-decoration:none;">Sign Up</a>
    </div>

    <div class="bottom-line"></div>

</div>

<script>
    const form = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('adminEmail');
    const passwordInput = document.getElementById('adminPassword');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    // Auto-fill password if remembered
    function checkAndAutoFillPassword() {
        const enteredEmail = emailInput.value.trim().toLowerCase();
        const savedMap = JSON.parse(localStorage.getItem('wearvault_admin_remembered_map')) || {};

        if (enteredEmail && savedMap[enteredEmail]) {
            passwordInput.value = savedMap[enteredEmail];
            rememberMeCheckbox.checked = true;
        } else {
            passwordInput.value = '';
            rememberMeCheckbox.checked = false;
        }
    }

    emailInput.addEventListener('input', checkAndAutoFillPassword);
    emailInput.addEventListener('change', checkAndAutoFillPassword);

    function validateEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const adminVal = emailInput.value.trim();
        const adminValKey = adminVal.toLowerCase();
        const passVal = passwordInput.value.trim();

        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        if(!validateEmail(adminVal)) {
            errorMsg.textContent = "Please enter a valid administrator email address.";
            errorMsg.style.display = 'block';
            return;
        }

        // Fetch accounts created via adsignup.html
        const storedAdmins = JSON.parse(localStorage.getItem('wearvault_admins')) || [];
        
        // Find registered admin by email
        const adminAccount = storedAdmins.find(acc => acc.email.toLowerCase() === adminValKey);

        if (!adminAccount) {
            errorMsg.textContent = "Invalid Admin ID. Please Sign Up first!";
            errorMsg.style.display = 'block';
            return;
        }

        // Verify password against stored admin account
        if (adminAccount.password === passVal) {
            let savedMap = JSON.parse(localStorage.getItem('wearvault_admin_remembered_map')) || {};

            if (rememberMeCheckbox.checked) {
                savedMap[adminValKey] = passVal;
            } else {
                delete savedMap[adminValKey];
            }

            localStorage.setItem('wearvault_admin_remembered_map', JSON.stringify(savedMap));
            localStorage.setItem('currentAdmin', JSON.stringify(adminAccount));
            
            successMsg.style.display = 'block';
            setTimeout(() => {
                // Link updated to admin.html
                window.location.href = "admin.html";
            }, 1000);
        } else {
            errorMsg.textContent = "Invalid administrator password. Access denied.";
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
