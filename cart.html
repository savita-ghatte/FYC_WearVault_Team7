<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | WearVault</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">

<style>

:root{
    --main-font:'DM Sans',sans-serif;
    --data-font:'DM Mono',monospace;
    --title-font:'Fraunces',serif;
    --blue:#062c5c;
    --border:#d6d3c8;
    --bg:#f9f8f4;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:2rem;
    background:var(--bg);
    color:#111;
    font-family:var(--main-font);
}


/* MAIN LAYOUT */

.checkout-container{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 360px;
    gap:2rem;
}


/* CARD */

.section-card{
    background:white;
    padding:1.5rem;
    border:1px solid var(--border);
    margin-bottom:1.5rem;
    border-radius:8px;
}


h1,h2{
    font-family:var(--title-font);
}

h2{
    margin-top:0;
}


/* INPUTS */

.input-group{
    margin-bottom:1rem;
}


label{
    display:block;
    font-size:.8rem;
    text-transform:uppercase;
    margin-bottom:.4rem;
}


input,
textarea,
select{

    width:100%;
    padding:12px;

    border:1px solid var(--border);
    border-radius:5px;

    font-family:var(--main-font);
}


input:focus,
textarea:focus,
select:focus{

    outline:none;
    border-color:var(--blue);

}



/* ERROR */

.error-msg{

    display:none;

    padding:12px;

    background:#fff1f1;

    color:#d9534f;

    border:1px solid #d9534f;

    margin-bottom:20px;

    font-weight:bold;

}



/* CART ITEMS */

.cart-item{

    display:flex;

    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #eee;

}


.cart-item-price{

    font-family:var(--data-font);

}



/* PAYMENT */

.payment-option{

    display:flex;

    gap:15px;

    align-items:center;

    padding:14px 0;

    cursor:pointer;

    border-bottom:1px solid #eee;

}


.payment-option input{

    width:auto;

}


.payment-option span{

    font-weight:500;

}



/* SUMMARY */


.summary-card{

    background:var(--blue);

    color:white;

    padding:1.5rem;

    position:sticky;

    top:20px;

    border-radius:8px;

}



.price-row{

    display:flex;

    justify-content:space-between;

    margin-bottom:15px;

    font-family:var(--data-font);

}



.total{

    border-top:1px solid rgba(255,255,255,.3);

    padding-top:15px;

    font-weight:bold;

    font-size:1.2rem;

}



/* PAYMENT DETAILS */

.payment-details{

    display:none;

    background:white;

    color:#111;

    padding:1rem;

    margin-top:15px;

    border-radius:6px;

}



/* QR */

.qr-box{

    text-align:center;

}


.qr-box img{

    width:150px;

    height:150px;

    border:2px dashed #aaa;

    padding:5px;

}




.upi-apps{

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

}


.app-btn{

    background:#f2f4f8;

    padding:7px 12px;

    border-radius:5px;

    color:#062c5c;

    text-decoration:none;

    font-size:.8rem;

    font-weight:bold;

}


/* BUTTON */


.confirm-btn{

    width:100%;

    margin-top:20px;

    padding:15px;

    border:none;

    cursor:pointer;

    font-weight:bold;

    background:white;

    color:var(--blue);

    transition:.3s;

}


.confirm-btn:hover{

    background:#d9534f;

    color:white;

}



/* RESPONSIVE */

@media(max-width:850px){

.checkout-container{

grid-template-columns:1fr;

}


.summary-card{

position:relative;

}

}


</style>

</head>


<body>


<div class="checkout-container">


<main>


<h1>Secure Checkout</h1>


<div id="globalError" class="error-msg"></div>



<section class="section-card">

<h2>Selected Outfit Pieces</h2>


<div id="cartItemsList">

<p style="color:#777">

No items selected.

</p>

</div>


</section>




<section class="section-card">


<h2>1. Personal Details</h2>


<div class="input-group">

<label>Full Name</label>

<input id="name" type="text" placeholder="Enter your name">

</div>



<div class="input-group">

<label>Phone Number</label>

<input id="phone" type="tel" maxlength="10" placeholder="10 digit number">

</div>



<div class="input-group">

<label>Email</label>

<input id="email" type="email" placeholder="example@gmail.com">

</div>



<div class="input-group">

<label>Delivery Address</label>

<textarea id="address" rows="3" placeholder="House, City, State, Pincode"></textarea>

</div>


</section>





<section class="section-card">


<h2>2. Payment Method</h2>


<label class="payment-option" onclick="switchPayment('upi')">

<input type="radio" name="payment" checked value="upi">

<span>UPI / QR Payment</span>

</label>



<label class="payment-option" onclick="switchPayment('card')">

<input type="radio" name="payment" value="card">

<span>Credit / Debit Card</span>

</label>



<label class="payment-option" onclick="switchPayment('bank')">

<input type="radio" name="payment" value="bank">

<span>Net Banking</span>

</label>



<label class="payment-option" onclick="switchPayment('cod')">

<input type="radio" name="payment" value="cod">

<span>Cash On Delivery</span>

</label>


</section>
<aside>

<div class="summary-card">


<h2 style="color:white;">Order Summary</h2>


<div class="price-row">

<span>Subtotal</span>

<span id="displaySubtotal">₹0</span>

</div>



<div class="price-row total">

<span>Total</span>

<span id="displayTotal">₹0</span>

</div>




<!-- UPI PAYMENT -->

<div id="upiPanel" class="payment-details" style="display:block;">


<div class="qr-box">


<p>
<strong>Scan QR Code To Pay</strong>
</p>


<img id="upiQrImage" src="QR.jpeg">


<p style="font-size:.8rem">

UPI ID:
<strong>wearvault@upi</strong>

</p>



<div class="upi-apps">

<a class="app-btn"
href="upi://pay?pa=wearvault@upi">
GPay
</a>


<a class="app-btn"
href="upi://pay?pa=wearvault@upi">
PhonePe
</a>


<a class="app-btn"
href="upi://pay?pa=wearvault@upi">
Paytm
</a>


</div>


</div>


</div>





<!-- CARD PAYMENT -->


<div id="cardPanel" class="payment-details">


<div class="input-group">

<label>Card Number</label>

<input id="cardNumber"
placeholder="1234 5678 9101 1121"
maxlength="19">

</div>



<div style="display:flex;gap:10px">


<div class="input-group" style="flex:1">

<label>Expiry</label>

<input id="cardExpiry"
placeholder="MM/YY"
maxlength="5">

</div>



<div class="input-group" style="flex:1">

<label>CVV</label>

<input id="cardCVV"
placeholder="123"
maxlength="3">

</div>


</div>



</div>





<!-- BANK -->


<div id="bankPanel" class="payment-details">


<label>Select Bank</label>


<select id="bankSelect">


<option value="">
Choose Bank
</option>


<option>
State Bank Of India
</option>


<option>
HDFC Bank
</option>


<option>
ICICI Bank
</option>


<option>
Axis Bank
</option>


</select>



</div>





<!-- COD -->


<div id="codPanel" class="payment-details">


<p>

Pay cash after delivery.

</p>


</div>




<button class="confirm-btn"
onclick="validateCheckout()">

CONFIRM ORDER

</button>



</div>


</aside>


</div>





<script>


// LOAD ORDER DATA


document.addEventListener("DOMContentLoaded",()=>{


let total =
localStorage.getItem("lastOutfitTotal") || "₹0";


document.getElementById("displaySubtotal")
.innerText=total;


document.getElementById("displayTotal")
.innerText=total;



let items =
JSON.parse(localStorage.getItem("outfitItems")) || [];



let box =
document.getElementById("cartItemsList");



if(items.length){


box.innerHTML =
items.map(item=>`


<div class="cart-item">


<div>

<strong>
${item.brand || ""}
</strong>

<br>

${item.name}

</div>


<div class="cart-item-price">

${item.priceString}

</div>


</div>


`).join("");

}


});







// PAYMENT SWITCH


function switchPayment(type){



document.querySelectorAll(".payment-details")
.forEach(panel=>{

panel.style.display="none";

});




if(type==="upi")

document.getElementById("upiPanel")
.style.display="block";



if(type==="card")

document.getElementById("cardPanel")
.style.display="block";



if(type==="bank")

document.getElementById("bankPanel")
.style.display="block";



if(type==="cod")

document.getElementById("codPanel")
.style.display="block";


}





// SHOW ERROR


function showError(message){


let box=document.getElementById("globalError");


box.innerText=message;


box.style.display="block";


window.scrollTo({
top:0,
behavior:"smooth"
});


}






function validateCheckout(){



let name =
document.getElementById("name").value.trim();


let phone =
document.getElementById("phone").value.trim();


let email =
document.getElementById("email").value.trim();


let address =
document.getElementById("address").value.trim();





if(!name || !phone || !email || !address){


showError(
"Please complete all personal details."
);


return;


}





if(!/^[0-9]{10}$/.test(phone)){


showError(
"Enter valid 10 digit mobile number."
);


return;


}




let method =
document.querySelector(
"input[name='payment']:checked"
).value;




if(method==="card"){


if(
!document.getElementById("cardNumber").value ||
!document.getElementById("cardExpiry").value ||
!document.getElementById("cardCVV").value
){


showError(
"Enter complete card details."
);


return;


}


}




if(method==="bank"){


if(!document.getElementById("bankSelect").value){


showError(
"Select your bank."
);


return;


}


}


    // SAVE ORDER DETAILS

    const orderID =
        "WV" + Date.now().toString().slice(-8);


    const orderData = {

        orderID: orderID,

        customer: {

            name:name,

            phone:phone,

            email:email,

            address:address

        },


        paymentMethod:method,


        total:
        localStorage.getItem("lastOutfitTotal") || "₹0",


        items:
        JSON.parse(localStorage.getItem("outfitItems")) || [],


        date:
        new Date().toLocaleString()

    };



    localStorage.setItem(
        "wearVaultOrder",
        JSON.stringify(orderData)
    );



    // SAVE CUSTOMER INFO FOR NEXT CHECKOUT

    localStorage.setItem(
        "wearVaultCustomer",
        JSON.stringify({
            name:name,
            phone:phone,
            email:email,
            address:address
        })
    );



    // REDIRECT AFTER SUCCESS


    window.location.href =
    "success.html";



}



</script>


</body>

</html>

</main>
