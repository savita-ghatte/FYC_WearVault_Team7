<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Confirmed | WearVault</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'DM Sans',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#d9e9ff,#eef6ff,#ffffff);
}

.success-container{
    width:460px;
    max-width:100%;
    text-align:center;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(12px);
    border-radius:22px;
    padding:45px 35px;
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 18px 45px rgba(0,0,0,.12);
    animation:fadeIn .8s ease;
}

.badge{
    display:inline-block;
    background:#e9f9ef;
    color:#28a745;
    padding:6px 14px;
    border-radius:50px;
    font-size:14px;
    font-weight:600;
    margin-bottom:18px;
}

.checkmark{
    width:90px;
    height:90px;
    display:block;
    margin:0 auto 25px;
    border-radius:50%;
    stroke:#28a745;
    stroke-width:4;
    stroke-miterlimit:10;
    box-shadow:inset 0 0 0 #28a745;
    animation:fill .4s ease-in-out .4s forwards,
              scale .3s ease-in-out .9s both;
}

.checkmark__circle{
    stroke-dasharray:166;
    stroke-dashoffset:166;
    stroke:#28a745;
    fill:none;
    animation:stroke .6s cubic-bezier(.65,0,.45,1) forwards;
}

.checkmark__check{
    stroke-dasharray:48;
    stroke-dashoffset:48;
    animation:stroke .3s cubic-bezier(.65,0,.45,1) .8s forwards;
}

@keyframes stroke{
    100%{
        stroke-dashoffset:0;
    }
}

@keyframes fill{
    100%{
        box-shadow:inset 0 0 0 40px #28a745;
    }
}

@keyframes scale{
    50%{
        transform:scale(1.08);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    color:#062c5c;
    font-size:32px;
    margin-bottom:15px;
}

.message{
    color:#555;
    line-height:1.8;
    font-size:16px;
    margin-bottom:18px;
}

.order-id{
    display:inline-block;
    background:#f5f8fc;
    color:#062c5c;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    margin-bottom:20px;
}

.note{
    color:#777;
    font-size:14px;
    margin-bottom:32px;
}

.btn-home{
    display:inline-block;
    padding:14px 34px;
    text-decoration:none;
    color:#fff;
    background:#062c5c;
    border-radius:10px;
    font-weight:600;
    transition:.3s ease;
}

.btn-home:hover{
    background:#0b4b95;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(6,44,92,.25);
}

</style>

</head>

<body>

<div class="success-container">

    <div class="badge">
        ✓ Payment Successful
    </div>

    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle
            class="checkmark__circle"
            cx="26"
            cy="26"
            r="25"
            fill="none"/>
        <path
            class="checkmark__check"
            fill="none"
            d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
    </svg>

    <h1>Order Confirmed!</h1>

    <p class="message">
        Thank you for shopping with <strong>WearVault</strong>.
        Your order has been placed successfully and is now being processed.
    </p>

    <div class="order-id">
        Order ID : #WV258941
    </div>

    <p class="note">
        A confirmation email with your order details will be sent shortly.
    </p>

    <a href="index.html" class="btn-home">
        Continue Shopping
    </a>

</div>

</body>
</html>
