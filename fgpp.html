<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #b6d4ff, #f6c4d4);
        }

        .container {
            width: 380px;
            text-align: center;
            background: rgba(255, 255, 255, 0.25);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
        }

        .line {
            width: 100%;
            height: 2px;
            background: #fff;
            margin: 10px 0 30px;
            opacity: 0.8;
        }

        h2 {
            font-size: 36px;
            font-weight: 300;
            color: #222;
            margin-bottom: 30px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #333;
            margin: 20px 0;
            padding: 8px 5px;
        }

        .input-box i {
            margin-right: 15px;
            color: #222;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #062c5c;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        button:hover {
            background: #0b3c7d;
        }

        .error-msg {
            color: #d9534f;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            line-height: 1.4;
        }

        .success-msg {
            color: #28a745;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
        }

        .bottom-line {
            width: 100%;
            height: 2px;
            background: #fff;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="line"></div>

    <h2>Reset Password</h2>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="userid" placeholder="Enter Email ID">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="newpass" placeholder="New Password">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="confirmpass" placeholder="Confirm Password">
    </div>

    <button onclick="resetPassword()">RESET PASSWORD</button>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg">Password reset successfully! Redirecting...</div>

    <div style="margin-top:20px; font-size:14px;">
        Remembered your password? <a href="login.html" style="color:#062c5c; font-weight:bold; text-decoration:none;">Log In</a>
    </div>

    <div class="bottom-line"></div>
</div>

<script>
function validateEmail(email) {
    const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return re.test(email);
}

function validatePasswordFormat(password) {
    const hasLetter = /[a-zA-Z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSymbol = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);
    return hasLetter && hasNumber && hasSymbol;
}

function resetPassword() {
    var user = document.getElementById("userid").value.trim();
    var newPass = document.getElementById("newpass").value.trim();
    var confirmPass = document.getElementById("confirmpass").value.trim();
    
    var errorMsg = document.getElementById("errorMsg");
    var successMsg = document.getElementById("successMsg");

    errorMsg.style.display = "none";
    successMsg.style.display = "none";

    if(user === "" || newPass === "" || confirmPass === "") {
        errorMsg.textContent = "Please fill all fields.";
        errorMsg.style.display = "block";
        return;
    }

    if(!validateEmail(user)) {
        errorMsg.textContent = "Please enter a valid email address.";
        errorMsg.style.display = "block";
        return;
    }

    if(!validatePasswordFormat(newPass)) {
        errorMsg.textContent = "Password must contain letters, numbers, and special symbols.";
        errorMsg.style.display = "block";
        return;
    }

    if(newPass !== confirmPass) {
        errorMsg.textContent = "Passwords do not match.";
        errorMsg.style.display = "block";
        return;
    }

    let accounts = JSON.parse(localStorage.getItem('wearvault_users')) || [];
    let accIndex = accounts.findIndex(acc => acc.email === user);

    if (user === "admin@gmail.com") {
        successMsg.style.display = "block";
        setTimeout(() => { window.location.href = "login.html"; }, 1500);
    } else if (accIndex !== -1) {
        accounts[accIndex].password = newPass;
        localStorage.setItem('wearvault_users', JSON.stringify(accounts));

        // Update remembered credentials if saved
        let remembered = JSON.parse(localStorage.getItem('wearvault_remembered'));
        if (remembered && remembered.email === user) {
            remembered.password = newPass;
            localStorage.setItem('wearvault_remembered', JSON.stringify(remembered));
        }

        successMsg.style.display = "block";
        setTimeout(() => { window.location.href = "login.html"; }, 1500);
    } else {
        errorMsg.textContent = "Invalid user account ID.";
        errorMsg.style.display = "block";
    }
}
</script>

</body>
</html>
