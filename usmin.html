<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Portal | WearVault</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#dcecff,#edf6ff,#ffffff);
}

.portal-container{
    width:720px;
    max-width:100%;
    text-align:center;
    padding:45px 35px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);
    border-radius:18px;
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 18px 40px rgba(0,0,0,.10);
    animation:fadeIn .8s ease;
}

.line,
.bottom-line{
    width:100%;
    height:2px;
    background:rgba(255,255,255,.7);
}

.line{
    margin-bottom:25px;
}

.bottom-line{
    margin-top:30px;
}

h1{
    font-size:42px;
    color:#062c5c;
    font-weight:600;
    margin-bottom:10px;
}

.subtitle{
    font-size:16px;
    color:#555;
    margin-bottom:35px;
}

.cards-wrapper{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:250px;
    max-width:300px;
    text-decoration:none;
    color:inherit;
    padding:30px 25px;
    border-radius:14px;
    background:rgba(255,255,255,.65);
    border:1px solid rgba(255,255,255,.7);
    transition:.35s;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(0,0,0,.12);
    background:#ffffff;
}

.icon{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#062c5c;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:20px;
    transition:.35s;
    box-shadow:0 8px 20px rgba(6,44,92,.20);
}

.icon i{
    color:#fff;
    font-size:30px;
}

.card:hover .icon{
    background:#0b4b95;
    transform:scale(1.08);
}

.card h2{
    color:#062c5c;
    margin-bottom:12px;
    font-size:24px;
}

.card p{
    color:#555;
    font-size:15px;
    line-height:1.6;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@media(max-width:700px){

.cards-wrapper{

    flex-direction:column;
    align-items:center;

}

.portal-container{

    padding:35px 25px;

}

h1{

    font-size:34px;

}

}

</style>

</head>

<body>

<div class="portal-container">

    <div class="line"></div>

    <h1>Welcome</h1>

    <p class="subtitle">
        Choose your portal to continue to WearVault.
    </p>

    <div class="cards-wrapper">

        <!-- User Portal -->

        <a href="login.html" class="card">

            <div class="icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2>User Portal</h2>

            <p>
                Access your account, manage your profile,
                view orders, and continue shopping.
            </p>

        </a>

        <!-- Admin Portal -->

        <a href="admin.html" class="card">

            <div class="icon">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h2>Admin Portal</h2>

            <p>
                Manage users, products, orders,
                and monitor the WearVault dashboard.
            </p>

        </a>

    </div>

    <div class="bottom-line"></div>

</div>

</body>
</html>
