<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Portal</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #b6d4ff, #f6c4d4);
            padding: 20px;
        }

        .portal-container {
            width: 700px;
            max-width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.25);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
        }

        .line {
            width: 100%;
            height: 2px;
            background: #fff;
            margin: 10px 0 25px;
            opacity: 0.8;
        }

        .bottom-line {
            width: 100%;
            height: 2px;
            background: #fff;
            margin-top: 25px;
            opacity: 0.8;
        }

        h1 {
            font-size: 40px;
            font-weight: 300;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #444;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .cards-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 30px 20px;
            flex: 1;
            min-width: 240px;
            max-width: 300px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 60px;
            height: 60px;
            background: #062c5c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            transition: background 0.3s;
        }

        .icon i {
            font-size: 26px;
            color: #ffffff;
        }

        .card:hover .icon {
            background: #0b3c7d;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #062c5c;
            font-weight: bold;
        }

        .card p {
            font-size: 0.88rem;
            color: #333;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="line"></div>

        <h1>Welcome</h1>
        <p class="subtitle">Please select your portal to continue</p>

        <div class="cards-wrapper">
            <!-- User Portal Link -->
            <a href="login.html" class="card">
                <div class="icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h2>User Portal</h2>
                <p>Access your dashboard, profile, and personal settings.</p>
            </a>

            <!-- Admin Portal Link -->
            <a href="adin.html" class="card">
                <div class="icon">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2>Admin Portal</h2>
                <p>Manage users, view system analytics, and system settings.</p>
            </a>
        </div>

        <div class="bottom-line"></div>
    </div>

</body>
</html>
